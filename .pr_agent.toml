[github_app]
pr_commands = ["/review"]
auto_run_on_pr_creation = true

[pr_reviewer]
force_new_review = true
require_code_suggestions_review = true
extra_instructions = """\
Review Instructions: GraphQL Query Naming Format

You are only required to review the **names of GraphQL queries** to ensure they strictly follow this naming convention:

Required Format:
QueryName + 'For' + OrganizationName

Where:
- QueryName: Any single or compound case non-sensitive words or abbreviation (e.g., GetUser, GetPersonalDetails, GetAssociateById, Admin, Data)
- For: The literal word 'For' (case-sensitive)
- OrganizationName: Any single or compound case non-sensitive words or abbreviation (e.g., Profile, Ama, MyLocalSocial, GEP, BeneficiaryService, ServiceOfUsers, MyAssociates, ABC, Teaming, Shuffling)

Examples of valid query names:
- GetUserForProfile
- RequiredComplianceLearningForMyLocalSocial
- DataForBeneficiaryService
- GetAssociateByWinForGEP
- GetAssociateByWinForAma

Rules:
1. Do not review or comment on logic, structure, performance, or syntax of the code.
2. Only check the query names. Ignore all other parts of the codebase.
3. Do not infer or verify the purpose, logic, or correctness of the names themselves.
4. If the query name matches the required format, your response must be: "Nothing to review".
5. If the query name does not match the format, suggest only a name correction that follows the correct structure.

This ensures consistency and clarity across all GraphQL query names in the project.
"""

